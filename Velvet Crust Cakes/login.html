<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Velvet Crust Cakes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-page">
    <div class="login-bg-decor login-bg-1"></div>
    <div class="login-bg-decor login-bg-2"></div>

    <div class="login-card">
      <div class="login-logo">
        <div class="logo-text">Velvet <span>Crust</span></div>
        <p>Welcome back — your cakes are waiting 🎂</p>
      </div>

      <h2>Sign In</h2>

      <div id="login-error" style="display:none; padding:12px 16px; background:var(--pink-light); border:1px solid var(--pink-blush); border-radius:12px; font-size:14px; color:var(--pink-deep); margin-bottom:20px; text-align:center;"></div>

      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Your password" autocomplete="current-password">
      </div>

      <div style="text-align:right; margin-bottom: 20px;">
        <a href="#" style="font-size:13px; color:var(--pink-rose); font-weight:500;">Forgot password?</a>
      </div>

      <button id="login-btn" class="btn-primary login-submit">Sign In →</button>

      <div class="login-divider">
        <span>or continue with</span>
      </div>

      <button class="btn-secondary" style="width:100%; justify-content:center; gap:10px;">
        <span>🌐</span> Continue with Google
      </button>

      <div class="login-links" style="margin-top:28px;">
        <p style="font-size:14px; color:var(--text-light);">
          Don't have an account? 
          <a href="#">Create one free</a>
        </p>
        <p style="margin-top:10px;">
          <a href="index.html">← Back to Home</a>
        </p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    document.getElementById('login-btn').addEventListener('click', () => {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errEl = document.getElementById('login-error');

      if (!email || !password) {
        errEl.textContent = 'Please fill in both email and password.';
        errEl.style.display = 'block';
        return;
      }

      // Simulate login — redirect to home
      errEl.style.display = 'none';
      document.getElementById('login-btn').textContent = 'Signing in…';
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 800);
    });


    document.getElementById('login-password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    });
  </script>
</body>
</html>
